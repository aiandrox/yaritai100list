<!--
  ファビコン（#229）。

  🔴 **チェックマークにしない**（2026-08-09 の利用者の判断）。
  「押したら印が付く」は todo アプリと同じで、**それでは何のアプリか分からない。**
  このサービスを別物にしているのは **100 という枠**の方。

  だから升目にする。**塗ってあるのが「やった」、空いているのが「まだ」。**
  書き出し画像（`export-image-template.ts`）の升目レイアウトと同じ言い方なので、
  OGP・書き出し画像・ここで見た目が揃う。

  🔴 **4列ではなく3列。** 書き出し画像は4列だが、**16px では4列は潰れる**
  （1マスが 2.5px になり、隙間が消えてただの模様になる。等倍に落として確認した）。
  マスの数は「100」を表しているわけではないので、**読めることを優先する。**

  ⚠️ 色は `src/tokens.css` のブランドの濃い色と同じ値。
  SVG は CSS カスタムプロパティを読めないので、**ここが2箇所目になっている。**

  ⚠️ このコメントにハイフン2つを続けて書かないこと。
  XML のコメントに書けず、`deno task og` が SVG を読めなくなる。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#b34452" />

  <!-- やった分。**左上から埋まっていく** -->
  <g fill="#fff">
    <rect x="2.5" y="2.5" width="7" height="7" rx="1.6" />
    <rect x="12.5" y="2.5" width="7" height="7" rx="1.6" />
    <rect x="2.5" y="12.5" width="7" height="7" rx="1.6" />
  </g>

  <!-- まだの分。**消さずに残す。** 空いている枠が見えることに意味がある -->
  <g fill="#fff" fill-opacity="0.32">
    <rect x="22.5" y="2.5" width="7" height="7" rx="1.6" />
    <rect x="12.5" y="12.5" width="7" height="7" rx="1.6" />
    <rect x="22.5" y="12.5" width="7" height="7" rx="1.6" />
    <rect x="2.5" y="22.5" width="7" height="7" rx="1.6" />
    <rect x="12.5" y="22.5" width="7" height="7" rx="1.6" />
    <rect x="22.5" y="22.5" width="7" height="7" rx="1.6" />
  </g>
</svg>
