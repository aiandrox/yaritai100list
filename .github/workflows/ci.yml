name: CI

# PR だけで走らせる。**main へ入った後のチェックは Deploy が行う**（deploy.yml）。
# ここでも push を拾うと、マージのたびに同じチェックが2回走る
on:
  pull_request:

# 同じブランチに続けて push したとき、古い実行を止める。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # .node-version を唯一の情報源にする。ここに数字を書かない
          node-version-file: .node-version
          cache: npm

      # 画像生成サービス（apps/render）は Deno。npm の道具では見られないので、
      # **Deno の道具で型と動きを見る**（#172）
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: install
        id: install
        run: npm ci

      # チェックは1つ落ちても残りを実行する。全部の失敗を1回の実行で把握できるようにするため
      # （ジョブを分けると依存のインストールが回数分かかる）。
      #
      # ただし install が失敗した実行では skip する。依存が入っていない状態の結果は
      # 信号として無意味で、読む側を混乱させる（#26）。
      - name: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      # apps/render は Deno。型・lint・テストをここで見る
      - name: render (deno)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/render
        run: |
          deno check main.ts main_test.ts
          deno lint
          deno test --allow-read --allow-env
