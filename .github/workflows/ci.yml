name: CI

# PR だけで走らせる。**main へ入った後のチェックは Deploy が行う**（deploy.yml）。
# ここでも push を拾うと、マージのたびに同じチェックが2回走る
on:
  pull_request:

# 同じブランチに続けて push したとき、古い実行を止める。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # 変更されたファイルの一覧を API から取るため（下記）
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ドキュメントだけの PR で、型検査もテストも走らせない（#222）。
      #
      # ⚠️ **ジョブは分けない。** 分けるとチェックの名前が変わり、
      # 「必須のチェック」が永遠に来ない PR ができる。
      # **1つのジョブの中で、重い手順を飛ばす。**
      #
      # 一覧を API から取るのは、`git diff` に全履歴（fetch-depth: 0）が要るため。
      # 履歴の取得はドキュメントだけの PR でも毎回かかる
      - name: 変更の中身を見る
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate -q '.[].filename')
          echo "$files"
          # .md 以外が1つでもあればコードの変更として扱う
          if printf '%s\n' "$files" | grep -qvE '\.md$'; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            echo 'code=false' >> "$GITHUB_OUTPUT"
            echo '::notice::ドキュメントだけの変更。型検査・テスト・Deno は飛ばす'
          fi

      - uses: actions/setup-node@v7
        with:
          # .node-version を唯一の情報源にする。ここに数字を書かない
          node-version-file: .node-version
          cache: npm

      # 画像生成サービス（apps/render）は Deno。npm の道具では見られないので、
      # **Deno の道具で型と動きを見る**（#172）
      - uses: denoland/setup-deno@v2
        if: ${{ steps.changed.outputs.code == 'true' }}
        with:
          deno-version: v2.x

      - name: install
        id: install
        run: npm ci

      # チェックは1つ落ちても残りを実行する。全部の失敗を1回の実行で把握できるようにするため
      # （ジョブを分けると依存のインストールが回数分かかる）。
      #
      # ただし install が失敗した実行では skip する。依存が入っていない状態の結果は
      # 信号として無意味で、読む側を混乱させる（#26）。
      - name: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changed.outputs.code == 'true' }}
        run: npm run typecheck

      - name: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changed.outputs.code == 'true' }}
        run: npm run lint

      # 🔴 **書式だけは常に見る。** prettier は `.md` も整形する（#222）
      - name: format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changed.outputs.code == 'true' }}
        run: npm test

      # apps/render は Deno。型・lint・テストをここで見る
      - name: render (deno)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changed.outputs.code == 'true' }}
        working-directory: apps/render
        # ⚠️ **deno.json のタスクを呼ぶ。** ここに同じコマンドを書くと、
        # 見るファイルが手元と CI でずれる（preview.ts が実際にずれていた）
        run: |
          deno task check
          deno lint
          deno task test
